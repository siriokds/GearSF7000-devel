name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Download SDL3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SDL3_TAG=$(gh release view --repo libsdl-org/SDL --json tagName -q '.tagName')
          SDL3_VERSION=${SDL3_TAG#release-}
          curl -sL "https://github.com/libsdl-org/SDL/releases/download/${SDL3_TAG}/SDL3-devel-${SDL3_VERSION}-VC.zip" -o SDL3-devel.zip
          7z x SDL3-devel.zip -oplatforms/windows/dependencies
          mv "platforms/windows/dependencies/SDL3-${SDL3_VERSION}" platforms/windows/dependencies/SDL3
      - name: Build the emulator with the debugger
        run: msbuild GearSF7000.sln /t:Clean,Build /p:Configuration=Release /p:Platform=x64
        working-directory: platforms/windows
      - name: Build the emulator alone
        run: msbuild GearSF7000.sln /t:Build /p:Configuration=Release /p:Platform=x64 /p:GearProfile=emulator
        working-directory: platforms/windows
      - name: Package
        shell: bash
        run: |
          for package in emulator-debugger:release emulator:release-emulator; do
            name=${package%%:*}; dir=${package#*:}
            mkdir "$name"
            cp "platforms/windows/$dir/GearSF7000.exe" "$name/"
            cp platforms/windows/dependencies/SDL3/lib/x64/SDL3.dll "$name/"
            cp platforms/gamecontrollerdb.txt "$name/"
            (cd "$name" && 7z a "../GearSF7000-${GITHUB_REF_NAME}-$name-windows-x64.zip" *)
          done
      - uses: actions/upload-artifact@v7
        with:
          name: GearSF7000-windows-x64
          path: GearSF7000-*.zip

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    # Ubuntu 25.04 has SDL3 as a package; the runner's Ubuntu does not yet.
    container: ubuntu:25.04
    steps:
      - name: Install the build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config python3 git libsdl3-dev libgtk-3-dev
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build and package
        # Both builds write platforms/linux/gearsf7000: each is packaged
        # before the next one replaces it.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for package in emulator-debugger:all emulator:emulator; do
            name=${package%%:*}; target=${package#*:}
            make -C platforms/linux -j"$(nproc)" "$target" USE_PICOSMSVDP_CORE=0
            mkdir "$name"
            cp platforms/linux/gearsf7000 "$name/"
            cp platforms/gamecontrollerdb.txt "$name/"
            tar -C "$name" -czf "GearSF7000-${GITHUB_REF_NAME}-$name-linux-x64.tar.gz" .
          done
      - uses: actions/upload-artifact@v7
        with:
          name: GearSF7000-linux-x64
          path: GearSF7000-*.tar.gz

  release:
    name: Release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: GearSF7000-*
          path: release
          merge-multiple: true
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "GearSF7000 ${{ github.ref_name }}" \
            --generate-notes
