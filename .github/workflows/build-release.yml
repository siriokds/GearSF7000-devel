name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Download SDL3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SDL3_TAG=$(gh release view --repo libsdl-org/SDL --json tagName -q '.tagName')
          SDL3_VERSION=${SDL3_TAG#release-}
          curl -sL "https://github.com/libsdl-org/SDL/releases/download/${SDL3_TAG}/SDL3-devel-${SDL3_VERSION}-VC.zip" -o SDL3-devel.zip
          7z x SDL3-devel.zip -oplatforms/windows/dependencies
          mv "platforms/windows/dependencies/SDL3-${SDL3_VERSION}" platforms/windows/dependencies/SDL3
      - name: Build
        run: msbuild GearSF7000.sln /t:Clean,Build /p:Configuration=Release /p:Platform=x64
        working-directory: platforms/windows
      - name: Package
        shell: bash
        run: |
          mkdir artifact
          cp platforms/windows/release/GearSF7000.exe artifact/
          cp platforms/windows/dependencies/SDL3/lib/x64/SDL3.dll artifact/
          cp platforms/gamecontrollerdb.txt artifact/
          cd artifact
          7z a "../GearSF7000-${GITHUB_REF_NAME}-desktop-windows-x64.zip" *
      - uses: actions/upload-artifact@v7
        with:
          name: GearSF7000-windows-x64
          path: GearSF7000-*.zip

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    # Ubuntu 25.04 has SDL3 as a package; the runner's Ubuntu does not yet.
    container: ubuntu:25.04
    steps:
      - name: Install the build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config python3 git libsdl3-dev libgtk-3-dev
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -C platforms/linux -j"$(nproc)" USE_PICOSMSVDP_CORE=0
      - name: Package
        run: |
          mkdir artifact
          cp platforms/linux/gearsf7000 artifact/
          cp platforms/gamecontrollerdb.txt artifact/
          tar -C artifact -czf "GearSF7000-${GITHUB_REF_NAME}-desktop-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: GearSF7000-linux-x64
          path: GearSF7000-*.tar.gz

  release:
    name: Release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: GearSF7000-*
          path: release
          merge-multiple: true
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "GearSF7000 ${{ github.ref_name }}" \
            --generate-notes
